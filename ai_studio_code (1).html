    function CoverLetterTailorView({ candidate, selectedJob, opportunities, onSelectJob, triggerToast }) {
      const [subTab, setSubTab] = useState('coverLetter');
      const [tone, setTone] = useState('UAE Protocol Diplomatic');
      const [copied, setCopied] = useState(false);

      const job = selectedJob || opportunities[0];

      const sampleCoverLetter = `Dear Hiring Committee & Leadership at ${job.entityName},\n\nI am writing to formally submit my candidacy for the position of ${job.title} at ${job.entityName} in ${job.emirate}.\n\nWith over 6 years of proven solutions architecture and enterprise software engineering experience, my background aligns directly with your institutional mission and the UAE National Strategy for Artificial Intelligence 2031. Having spearheaded large-scale microservices, zero-trust cloud infrastructure, and robust API frameworks, I bring both technical rigor and a keen understanding of sovereign data compliance.\n\nI welcome the opportunity to discuss how my technical acumen can support ${job.entityName}'s transformation initiatives.\n\nSincerely,\n${candidate.fullName}\n${candidate.location} | ${candidate.email}`;

      const sampleColdEmailSubject = `Application & Strategic Inquiry: ${job.title} — ${candidate.fullName}`;
      const sampleColdEmailBody = `Dear Talent Acquisition & Strategic Hiring Leadership at ${job.entityName},\n\nI hope this message finds you well.\n\nI am reaching out regarding the ${job.title} position at ${job.entityName}. With extensive experience in enterprise cloud architecture, TypeScript microservices, and secure digital platform engineering, I have tracked ${job.entityName}'s leadership with great admiration.\n\nI have attached my executive profile and would be grateful for a brief introductory conversation.\n\nBest regards,\n${candidate.fullName}\n${candidate.email} | ${candidate.phone}`;

      const handleCopy = (text) => {
        navigator.clipboard.writeText(text);
        setCopied(true);
        triggerToast('Copied to clipboard!');
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className="space-y-6">
          <div className="rounded-2xl bg-gradient-to-r from-slate-900 via-slate-900 to-teal-950/40 p-6 border border-slate-800 shadow-xl space-y-4">

                <label className="block text-slate-400 mb-1 font-semibold">Target Job / Entity:</label>

                  onChange={(e) => onSelectJob(opportunities.find(o => o.id === e.target.value))}
                  className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white"

                  {opportunities.map((o) => (

              </div>

              <div>
                <label className="block text-slate-400 mb-1 font-semibold">Protocol Tone:</label>

                  <option value="UAE Protocol Diplomatic">UAE Protocol Diplomatic (Ministries & Gov)</option>
                  <option value="Executive Vision 2031">Executive Vision 2031 (Sovereign Holdings)</option>
                </select>
              </div>
            </div>
          </div>

          <div className="flex space-x-2 border-b border-slate-800 pb-2 text-xs sm:text-sm font-semibold">
            <button
              onClick={() => setSubTab('coverLetter')}
              className={`px-4 py-2 rounded-xl transition-all ${subTab === 'coverLetter' ? 'bg-teal-500/20 text-teal-300 border border-teal-500/40' : 'text-slate-400'}`}
            >
              Formal UAE Cover Letter
            </button>
            <button
              onClick={() => setSubTab('coldEmail')}
              className={`px-4 py-2 rounded-xl transition-all ${subTab === 'coldEmail' ? 'bg-teal-500/20 text-teal-300 border border-teal-500/40' : 'text-slate-400'}`}
            >
              Executive Cold Email
            </button>
          </div>

          {subTab === 'coverLetter' ? (
            <div className="rounded-2xl bg-slate-900/90 border border-slate-800 p-6 space-y-4 shadow-xl">
              <div className="flex justify-between items-center pb-2 border-b border-slate-800 text-xs">
                <span className="text-slate-400">Tailored for <strong>{job.entityName}</strong></span>
                <button
                  onClick={() => handleCopy(sampleCoverLetter)}
                  className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-semibold"
                >
                  {copied ? '✓ Copied' : 'Copy Text'}
                </button>
              </div>
              <textarea
                rows={14}
                defaultValue={sampleCoverLetter}
                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-slate-200 text-xs sm:text-sm leading-relaxed"
              />

          ) : (
            <div className="rounded-2xl bg-slate-900/90 border border-slate-800 p-6 space-y-4 shadow-xl text-xs">
              <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                <span className="text-slate-400">Direct Outreach for <strong>{job.title}</strong></span>

          <div className="rounded-2xl bg-gradient-to-r from-slate-900 via-slate-900 to-sky-950/40 p-6 border border-slate-800 shadow-xl space-y-4">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <h2 className="text-xl font-bold text-white tracking-tight">Direct Telegram Dispatcher & Autonomous Alerts</h2>
                <p className="text-xs sm:text-sm text-slate-300 mt-1">
                  Pushes instantaneous match alerts directly to Telegram Bot <strong>@UAE_Job_Intelligence_Alerts_bot</strong>.
                </p>
              </div>
              <button
                onClick={handleSimulateDailyRun}
                className="px-4 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs shadow-md transition-all shrink-0"
              >
                ⚡ Simulate 07:00 AM Daily Run
              </button>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2 border-t border-slate-800 text-xs">
              <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                <span className="text-slate-400 block text-[11px]">Bot Username:</span>
                <strong className="text-sky-300 font-mono">@UAE_Job_Intelligence_Alerts_bot</strong>
              </div>
              <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                <span className="text-slate-400 block text-[11px]">Target Chat ID:</span>
                <strong className="text-emerald-400 font-mono">{settings.telegramChatId}</strong>
              </div>
              <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                <span className="text-slate-400 block text-[11px]">Schedule:</span>
                <strong className="text-amber-300">07:00 AM UAE (03:00 UTC)</strong>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="rounded-2xl bg-slate-900/80 border border-slate-800 p-6 space-y-4 shadow-xl text-xs">
              <h3 className="text-base font-bold text-white">Instant Dispatch Console</h3>
              <div>
                <label className="block text-slate-400 mb-1 font-semibold">Select Opportunity:</label>
                <select
                  value={selectedId}
                  onChange={(e) => setSelectedId(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-medium"
                >
                  {opportunities.map((o) => (
                    <option key={o.id} value={o.id}>{o.title} — {o.entityName} ({o.matchScore}%)</option>
                  ))}
                </select>
              </div>

              <button
                onClick={() => onDispatchJob(job)}
                className="w-full py-3 rounded-xl bg-gradient-to-r from-sky-600 to-teal-600 hover:from-sky-500 hover:to-teal-500 text-white font-bold text-xs sm:text-sm shadow-md"
              >
                ✈ Dispatch Instant Alert to Telegram
              </button>
            </div>

            <div className="rounded-2xl bg-slate-900/80 border border-slate-800 p-6 space-y-4 shadow-xl">
              <h3 className="text-base font-bold text-white text-xs">Telegram Message Payload Preview</h3>
              <div className="rounded-xl bg-slate-950 border border-slate-800 p-4 font-mono text-xs text-slate-300 space-y-1.5 shadow-inner">
                <div className="text-emerald-400 font-bold">🇦🇪 WASEET UAE JOB RADAR ALERT 🇦🇪</div>
                <div className="text-slate-600">━━━━━━━━━━━━━━━━━━━━</div>
                <div>🎯 <strong>Match Score:</strong> <span className="text-emerald-300 font-bold">{job.matchScore}%</span></div>
                <div>💼 <strong>Position:</strong> {job.title}</div>
                <div>🏢 <strong>Entity:</strong> {job.entityName} ({job.entityType})</div>
                <div>📍 <strong>Emirate:</strong> {job.emirate}</div>
                <div>💰 <strong>Salary:</strong> {job.salaryRangeAED}</div>
                <div className="pt-1 text-sky-400">🔗 <strong>Direct Official Portal:</strong></div>
                <div className="text-sky-300 underline break-all">{job.directApplyUrl}</div>
              </div>
            </div>
          </div>

          <div className="rounded-2xl bg-slate-900/80 border border-slate-800 p-6 space-y-3 shadow-xl text-xs">
            <h3 className="text-base font-bold text-white">Dispatch Audit Log</h3>
            <div className="overflow-x-auto">
              <table className="w-full text-left">
                <thead className="text-slate-400 border-b border-slate-800 text-[10px] uppercase">
                  <tr>
                    <th className="py-2">Time</th>
                    <th className="py-2">Role</th>
                    <th className="py-2">Entity</th>
                    <th className="py-2">Match</th>
                    <th className="py-2">Chat ID</th>
                    <th className="py-2">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/60">
                  {logs.map((l) => (
                    <tr key={l.id}>
                      <td className="py-2 font-mono text-slate-400">{l.timestamp}</td>
                      <td className="py-2 font-semibold text-white">{l.jobTitle}</td>
                      <td className="py-2 text-emerald-300">{l.entityName}</td>
                      <td className="py-2 font-bold text-emerald-400">{l.matchScore}%</td>
                      <td className="py-2 font-mono text-slate-400">{l.chatId}</td>
                      <td className="py-2"><span className="text-emerald-300 font-bold">Dispatched ✓</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // --- TAB 8: SETTINGS HUB VIEW ---
    function SettingsHubView({ settings, onUpdateSettings }) {
      return (
        <div className="space-y-6">
          <div className="rounded-2xl bg-gradient-to-r from-slate-900 via-slate-900 to-slate-800 p-6 border border-slate-800 shadow-xl space-y-2">
            <h2 className="text-xl font-bold text-white tracking-tight">Settings & System Configurations</h2>
            <p className="text-xs sm:text-sm text-slate-300">
              Configure autonomous match thresholds, preferred Emirates & sectors, and Telegram alert routing.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 text-xs">
            <div className="rounded-2xl bg-slate-900/80 border border-slate-800 p-6 space-y-4 shadow-xl">
              <h3 className="text-base font-bold text-white">Autonomous Matching</h3>
              <div>
                <div className="flex justify-between items-center mb-1">
                  <label className="font-semibold text-slate-300">Minimum Score Floor: {settings.minMatchScore}%</label>
                  <span className="text-emerald-400 font-mono text-[10px]">Strict 60%+ Floor</span>
                </div>
                <input
                  type="range"
                  min={60}
                  max={95}
                  value={settings.minMatchScore}
                  onChange={(e) => onUpdateSettings({ ...settings, minMatchScore: Number(e.target.value) })}
                  className="w-full accent-emerald-500 cursor-pointer h-2 bg-slate-800 rounded-lg"
                />
              </div>

              <div>
                <label className="block text-slate-300 mb-1 font-semibold">Telegram Chat ID:</label>
                <input
                  type="text"
                  value={settings.telegramChatId}
                  onChange={(e) => onUpdateSettings({ ...settings, telegramChatId: e.target.value })}
                  className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white font-mono"
                />
              </div>
            </div>

            <div className="rounded-2xl bg-slate-900/80 border border-slate-800 p-6 space-y-4 shadow-xl">
              <h3 className="text-base font-bold text-white">System Diagnostics</h3>
              <div className="space-y-2 text-slate-300">
                <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 flex justify-between">
                  <span>Gemini AI Grounding:</span>
                  <strong className="text-emerald-400 font-bold">Online (Active)</strong>
                </div>
                <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 flex justify-between">
                  <span>Daily 07:00 AM UAE Cron:</span>
                  <strong className="text-amber-400 font-bold">Scheduled</strong>
                </div>
                <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 flex justify-between">
                  <span>Telegram Bot Gateway:</span>
                  <strong className="text-sky-400 font-bold">Connected (@UAE_Job_Bot)</strong>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Render Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
